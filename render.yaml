services:
  # VENM Catalog Express REST API Backend
  - type: web
    name: venm-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: venm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://venm-catalog.vercel.app

databases:
  # Production PostgreSQL Database
  - name: venm-db
    databaseName: venm_database
    user: venm_database_user
    plan: free
    region: oregon
